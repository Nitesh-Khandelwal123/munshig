[project]
name = "munshig"
version = "0.1.0"
description = "MunshiG: a free, fully local assistant that answers customers on WhatsApp and turns shared invoices into Tally entries after the owner approves them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "zxing-cpp>=2.2",
]

[project.optional-dependencies]
openjarvis = ["openjarvis"]
dev = [
    "pytest>=8.0",
    "qrcode>=7.4",
    "fpdf2>=2.7",
]

[project.scripts]
munshig = "munshig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["munshig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
